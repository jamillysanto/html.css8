    .glow-on-hover {
      width: 220px;
      height: 50px;
      border: none;
      outline: none;
      color: #fff;
      background: #111;
      cursor: pointer;
      position: relative;
      z-index: 0;
      border-radius: 10px;
    }
    
    .glow-on-hover:before {
      content: '';
      background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
      position: absolute;
      top: -2px;
      left:-2px;
      background-size: 400%;
      z-index: -1;
      filter: blur(5px);
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      animation: glowing 20s linear infinite;
      opacity: 0;
      transition: opacity .3s ease-in-out;
      border-radius: 10px;
    }
    
    .glow-on-hover:active {
      color: #000
    }
    
    .glow-on-hover:active:after {
      background: transparent;
    }
    
    .glow-on-hover:hover:before {
      opacity: 1;
    }
    
    .glow-on-hover:after {
      z-index: -1;
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: #111;
      left: 0;
      top: 0;
      border-radius: 10px;
    }
    
    @keyframes glowing {
      0% { background-position: 0 0; }
      50% { background-position: 400% 0; }
      100% { background-position: 0 0; }
    }
    </style>

   <style>
    :root {
  --size: 40px;
  --cor-azul: #4c4c4c;
  --cor-preto: #010046;
}
.loading {
  --animacao: 3000ms;
  position: relative;
  margin: auto;
  width: var(--size);
  height: var(--size);
}
.loading .loading-pulsa {
  position: absolute;
  top: calc(50% - var(--size) / 2);
  left: calc(50% - var(--size) / 2);
  width: var(--size);
  height: var(--size);
  background: var(--bg);
  border-radius: 50%;
  animation: pulsa var(--animacao) ease-in-out infinite;
}
@keyframes pulsa {
  0%, 100% {
    transform: scale(0.5);
    opacity: 1;
  }
  50% {
    transform: scale(1.5);
    opacity: 0;
  }
}
.loading .loading-pulsa:nth-of-type(1) {
  --bg: var(--cor-azul);
}
.loading .loading-pulsa:nth-of-type(2) {
  --bg: var(--cor-preto);
  animation-delay: calc(var(--animacao) / -2);
}
   </style>
